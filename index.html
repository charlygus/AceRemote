<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AceRemote - Seccion Privada</title>
    <style>
        /* Estilos optimizados para Android TV */
        body {
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        h1 {
            color: #f1f1f1;
            font-size: 1.5rem;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .contenedor-lista {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .match-card {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            border: 2px solid transparent;
            outline: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .match-card:focus, .match-card:hover {
            background-color: #333;
            border-color: #007bff;
            transform: scale(1.02);
        }

        .info-jornada {
            font-size: 0.8rem;
            color: #aaa;
            text-transform: uppercase;
        }

        .equipo-texto {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .no-content {
            text-align: center;
            color: #666;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <h1>Partidos y Repeticiones: Barca y Villarreal</h1>
    
    <div id="lista-eventos" class="contenedor-lista">
        </div>

    <script>
        /**
         * COPIA MAESTRA - ACE REMOTE WEB APP
         * Actualizado: 18 de febrero de 2026
         */

        const AppDeportiva = {
            // Configuración de filtrado
            config: {
                equiposVip: ['BARCELONA', 'BARSA', 'VILLARREAL'],
                excluir: 'CHAMPIONS',
                // Protocolo para reproductor nativo (evita anuncios web)
                playerProtocol: 'acestream://' 
            },

            // Datos de la última jornada y semana (Simulados con IDs de AceStream)
            obtenerDatos() {
                return [
                    { title: 'Girona vs FC Barcelona', id: 'ace_barca_01', cat: 'Ultima Jornada' },
                    { title: 'Getafe vs Villarreal', id: 'ace_villarreal_01', cat: 'Ultima Jornada' },
                    { title: 'Repeticion: Barcelona vs Alaves', id: 'ace_barca_replay', cat: 'Semana' },
                    { title: 'Repeticion: Villarreal vs Betis', id: 'ace_villarreal_replay', cat: 'Semana' },
                    { title: 'Bayern vs Barcelona', id: 'ace_ucl_skip', cat: 'Champions' }, // Se filtrará
                    { title: 'Real Madrid vs Sevilla', id: 'ace_other', cat: 'Ultima Jornada' } // Se filtrará
                ];
            },

            // Motor de filtrado
            filtrarContenido(datos) {
                return datos.filter(item => {
                    const nombre = item.title.toUpperCase();
                    const categoria = item.cat.toUpperCase();
                    
                    const coincideEquipo = this.config.equiposVip.some(equipo => nombre.includes(equipo));
                    const esChampions = nombre.includes(this.config.excluir) || categoria.includes(this.config.excluir);

                    return coincideEquipo && !esChampions;
                });
            },

            // Renderizado en pantalla (Sin emojis)
            renderizar() {
                const contenedor = document.getElementById('lista-eventos');
                const crudo = this.obtenerDatos();
                const filtrados = this.filtrarContenido(crudo);

                if (filtrados.length === 0) {
                    contenedor.innerHTML = '<div class="no-content">No hay partidos disponibles para estos filtros.</div>';
                    return;
                }

                contenedor.innerHTML = filtrados.map(partido => `
                    <div class="match-card" tabindex="0" onclick="AppDeportiva.lanzarPlayer('${partido.id}')">
                        <div>
                            <div class="info-jornada">${partido.cat}</div>
                            <div class="equipo-texto">${partido.title}</div>
                        </div>
                        <div style="color: #007bff; font-weight: bold;">VER AHORA</div>
                    </div>
                `).join('');
                
                // Poner el foco en el primer elemento para control con mando TV
                document.querySelector('.match-card')?.focus();
            },

            // Lanzamiento directo al reproductor nativo (Sin Ads)
            lanzarPlayer(contentId) {
                // Forzamos el uso del motor nativo de Android TV (ExoPlayer/VLC)
                const urlFinal = `${this.config.playerProtocol}${contentId}?player=native`;
                console.log("Accediendo a: " + urlFinal);
                window.location.href = urlFinal;
            }
        };

        // Iniciar App
        document.addEventListener('DOMContentLoaded', () => AppDeportiva.renderizar());
    </script>
</body>
</html>
