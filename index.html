<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AceRemote</title>
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    
    <link rel="stylesheet" href="style.css?v=37">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        .action-stack { display: table; width: 100%; border-spacing: 0 8px; }
        .action-group-row { display: table-row; }
        .action-cell { display: table-cell; vertical-align: middle; text-align: right; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .lang-flag { width: 22px; height: 14px; border-radius: 2px; margin-right: 10px; vertical-align: middle; }
        .track-row { border-bottom: 2px solid rgba(255,255,255,0.12) !important; margin-bottom: 5px; padding: 15px 10px !important; }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="brand-container">
                <img src="icon.png" alt="Logo" class="app-logo">
                <h1>AceRemote</h1>
            </div>
            <button onclick="iniciarCarga()" class="refresh-btn"><i class="fa-solid fa-arrows-rotate"></i></button>
        </div>
        <div class="search-container">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="Buscar..." onkeyup="filtrarBusqueda()">
            </div>
        </div>
    </header>

    <div id="tabs-container" class="tabs"></div>
    <div id="loader" class="loader-container"><div id="loader-text" class="loader-text">0%</div></div>
    <main id="contenedor-eventos"></main>

    <script>
        // REEMPLAZA CON TU URL DE GOOGLE APPS SCRIPT
        var API_URL = 'https://script.google.com/macros/s/AKfycbyaDrtYeHao6x9R8EWLh6gKAcStTmQuy5xaI3sfGmoYvrR4wSEpggrGEaa7kApO3LjI/exec'; 
        
        var todosLosDatos = []; 
        var categoriaActual = '';
        var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        function iniciarCarga() {
            var container = document.getElementById('contenedor-eventos');
            var tabsContainer = document.getElementById('tabs-container');
            var loader = document.getElementById('loader');
            var loaderText = document.getElementById('loader-text');
            
            container.innerHTML = ''; 
            tabsContainer.innerHTML = '';
            loader.style.display = 'block';
            loaderText.innerText = '0%';

            var xhr = new XMLHttpRequest();
            xhr.open('GET', API_URL, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState == 4) {
                    if (xhr.status == 200) {
                        loaderText.innerText = '100%';
                        try {
                            todosLosDatos = JSON.parse(xhr.responseText);
                            loader.style.display = 'none';
                            generarPestanas(todosLosDatos);
                        } catch(e) {
                            loader.style.display = 'none';
                            container.innerHTML = '<p style="color:red; text-align:center;">Error en datos</p>';
                        }
                    } else {
                        loader.style.display = 'none';
                        container.innerHTML = '<p style="color:red; text-align:center;">Error de conexión</p>';
                    }
                }
            };
            xhr.send();
        }

        function generarPestanas(datos) {
            var tabsContainer = document.getElementById('tabs-container');
            var cats = [];
            for (var i = 0; i < datos.length; i++) {
                if (cats.indexOf(datos[i].categoria) === -1) cats.push(datos[i].categoria);
            }

            var orden = ["PIMPLE TV", "MYFOOTBALL", "PLATIN SPORT", "OTROS"];
            cats.sort(function(a, b) {
                var idxA = orden.indexOf(a);
                var idxB = orden.indexOf(b);
                if (idxA === -1) idxA = 99;
                if (idxB === -1) idxB = 99;
                return idxA - idxB;
            });

            categoriaActual = cats[0] || '';

            for (var j = 0; j < cats.length; j++) {
                var btn = document.createElement('button');
                btn.className = (cats[j] === categoriaActual) ? 'tab-btn active' : 'tab-btn';
                btn.innerText = cats[j];
                btn.setAttribute('onclick', "filtrar('" + cats[j] + "', this)");
                tabsContainer.appendChild(btn);
            }

            if (categoriaActual) {
                var filtrados = [];
                for (var k = 0; k < datos.length; k++) {
                    if (datos[k].categoria === categoriaActual) filtrados.push(datos[k]);
                }
                renderizar(filtrados);
            }
        }

        function renderizar(lista) {
            var container = document.getElementById('contenedor-eventos');
            container.innerHTML = '';
            
            for (var i = 0; i < lista.length; i++) {
                var item = lista[i];
                var row = document.createElement('div');
                row.className = 'track-row';
                
                var contenidoIcono = '';
                var mostrarIcono = true;
                if (item.origen === "MyFootball") {
                    mostrarIcono = false;
                } else if (item.logo1 && item.logo2) {
                    contenidoIcono = '<div class="team-logos"><div class="logo-circle"><img src="'+item.logo1+'"></div><div class="logo-circle"><img src="'+item.logo2+'"></div></div>';
                } else {
                    contenidoIcono = '<i class="fa-solid fa-tv"></i>';
                }

                var botonesHtml = '';
                if (item.enlaces && item.enlaces.length > 0) {
                    botonesHtml = '<div class="action-stack">';
                    for (var j = 0; j < item.enlaces.length; j++) {
                        var s = item.enlaces[j];
                        botonesHtml += '<div class="action-group-row"><div class="action-cell">' +
                            '<img src="'+s.bandera+'" class="lang-flag">' +
                            (!isIOS ? '<div class="action-icon play-btn" onclick="abrirEnlace(\''+s.id+'\', event)"><i class="fa-solid fa-play"></i></div>' : '') +
                            '<div class="action-icon copy-btn" onclick="copiarID(\''+s.id+'\', this, event)"><i class="fa-regular fa-copy"></i></div>' +
                        '</div></div>';
                    }
                    botonesHtml += '</div>';
                } else {
                    botonesHtml = (!isIOS ? '<div class="action-icon play-btn" onclick="abrirEnlace(\''+item.id+'\', event)"><i class="fa-solid fa-play"></i></div>' : '') +
                                  '<div class="action-icon copy-btn" onclick="copiarID(\''+item.id+'\', this, event)"><i class="fa-regular fa-copy"></i></div>';
                }

                row.innerHTML = (mostrarIcono ? '<div class="track-icon-box">'+contenidoIcono+'</div>' : '') +
                    '<div class="track-info" style="'+(!mostrarIcono ? 'padding-left:10px;' : '')+'">' +
                        '<div class="track-title" style="font-weight:bold;">'+item.titulo+'</div>' +
                        '<div class="track-meta"><span class="status-badge">'+item.origen+'</span></div>' +
                    '</div>' +
                    '<div class="actions-container" style="flex:1; justify-content:flex-end; display:flex;">' + botonesHtml + '</div>';
                
                container.appendChild(row);
            }
        }

        function filtrar(cat, btn) {
            categoriaActual = cat;
            var btns = document.getElementsByClassName('tab-btn');
            for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
            btn.classList.add('active');
            
            var filtrados = [];
            for (var j = 0; j < todosLosDatos.length; j++) {
                if (todosLosDatos[j].categoria === cat) filtrados.push(todosLosDatos[j]);
            }
            renderizar(filtrados);
        }

        function filtrarBusqueda() {
            var q = document.getElementById('searchInput').value.toLowerCase();
            var filtrados = [];
            for (var i = 0; i < todosLosDatos.length; i++) {
                if ((todosLosDatos[i].titulo + todosLosDatos[i].categoria).toLowerCase().indexOf(q) !== -1) filtrados.push(todosLosDatos[i]);
            }
            renderizar(filtrados);
        }

        function copiarID(txt, btn, ev) {
            if (ev) ev.stopPropagation();
            var dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = txt;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);
            btn.closest('.track-row').classList.add('copied');
        }

        function abrirEnlace(id, ev) {
            if (ev) ev.stopPropagation();
            window.location.href = 'acestream://' + id;
        }

        iniciarCarga();
    </script>
</body>
</html>
