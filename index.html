<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AceRemote</title>
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    
    <link rel="stylesheet" href="style.css?v=36">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        /* Estilos específicos para la vista de MyFootball en Android TV */
        .action-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .action-group-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 15px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .action-group-row:last-child {
            border-bottom: none;
        }
        .lang-flag {
            width: 24px;
            height: 16px;
            border-radius: 2px;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
        }
        /* Separación clara entre partidos */
        .track-row {
            border-bottom: 2px solid rgba(255,255,255,0.12) !important;
            margin-bottom: 8px;
            align-items: flex-start !important;
            padding: 18px 12px !important;
            background: rgba(255,255,255,0.02);
        }
        .track-row:hover {
            background: rgba(255,255,255,0.05);
        }
    </script>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="brand-container">
                <img src="icon.png" alt="Logo" class="app-logo">
                <h1>AceRemote</h1>
            </div>
            <button onclick="iniciarCarga()" class="refresh-btn">
                <i class="fa-solid fa-arrows-rotate"></i>
            </button>
        </div>
        <div class="search-container">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="Buscar canal o partido..." onkeyup="filtrarBusqueda()">
            </div>
        </div>
    </header>

    <div id="tabs-container" class="tabs"></div>
    <div id="loader" class="loader-container"><div id="loader-text" class="loader-text">0%</div></div>
    <main id="contenedor-eventos"></main>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyaDrtYeHao6x9R8EWLh6gKAcStTmQuy5xaI3sfGmoYvrR4wSEpggrGEaa7kApO3LjI/exec'; 
        
        let todosLosDatos = []; 
        let categoriaActual = '';
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        async function iniciarCarga() {
            const container = document.getElementById('contenedor-eventos');
            const tabsContainer = document.getElementById('tabs-container');
            const loader = document.getElementById('loader');
            const loaderText = document.getElementById('loader-text');
            
            container.innerHTML = ''; 
            tabsContainer.innerHTML = '';
            loader.style.display = 'block';
            loaderText.innerText = '0%';
            
            let porcentaje = 0;
            let intervalo = setInterval(() => {
                if (porcentaje < 95) {
                    porcentaje += Math.floor(Math.random() * 10) + 2;
                    loaderText.innerText = porcentaje + '%';
                }
            }, 100);

            try {
                const response = await fetch(API_URL);
                const datos = await response.json();
                clearInterval(intervalo);
                loaderText.innerText = '100%';
                
                todosLosDatos = datos;
                
                setTimeout(() => {
                    loader.style.display = 'none';
                    if (todosLosDatos && todosLosDatos.length > 0) {
                        generarPestanas(todosLosDatos);
                    } else {
                        container.innerHTML = '<p style="text-align:center; color:#888; margin-top:50px;">No se encontraron datos.</p>';
                    }
                    setInterval(actualizarContadores, 60000);
                }, 300);
            } catch (error) {
                clearInterval(intervalo);
                loader.style.display = 'none';
                container.innerHTML = '<p style="text-align:center; color:red; margin-top:50px;">Error al cargar datos. Reintenta.</p>';
            }
        }

        function generarPestanas(datos) {
            const tabsContainer = document.getElementById('tabs-container');
            let categoriasSet = [...new Set(datos.map(item => item.categoria))];
            
            const ordenSugerido = ["PIMPLE TV", "MYFOOTBALL", "PLATIN SPORT", "OTROS"];
            
            let categoriasOrdenadas = categoriasSet.sort((a, b) => {
                let idxA = ordenSugerido.indexOf(a);
                let idxB = ordenSugerido.indexOf(b);
                if (idxA === -1) idxA = 90;
                if (idxB === -1) idxB = 90;
                return idxA - idxB;
            });

            // Seleccionamos la primera categoría por defecto
            categoriaActual = categoriasOrdenadas[0] || '';

            categoriasOrdenadas.forEach(cat => {
                if(cat) {
                    const btn = document.createElement('button');
                    btn.className = (cat === categoriaActual) ? 'tab-btn active' : 'tab-btn';
                    btn.innerText = cat; 
                    btn.onclick = function() { filtrar(cat, this); };
                    tabsContainer.appendChild(btn);
                }
            });

            if (categoriaActual) {
                renderizar(todosLosDatos.filter(i => i.categoria === categoriaActual));
            }
        }

        function calcularTiempo(timestamp) {
            if (!timestamp) return { texto: "", clase: "" };
            const ahora = new Date().getTime();
            const diff = timestamp - ahora;
            const diffMinutos = Math.floor(diff / 1000 / 60);

            if (diff <= 0 && diff > -7200000) return { texto: `EN JUEGO`, clase: "status-live" };
            if (diff <= -7200000) return { texto: "FINALIZADO", clase: "status-ended" };

            if (diff > 0) {
                const horas = Math.floor(diffMinutos / 60);
                const mins = diffMinutos % 60;
                if (horas > 24) {
                    let fecha = new Date(timestamp);
                    let h = fecha.getHours();
                    let m = (fecha.getMinutes() < 10 ? '0' : '') + fecha.getMinutes();
                    return { texto: (fecha.getDate()) + "/" + (fecha.getMonth()+1) + " • " + h + ":" + m, clase: "status-future" };
                }
                if (horas === 0) return { texto: "Comienza en " + mins + "m", clase: "status-soon" };
                return { texto: "Comienza en " + horas + "h " + mins + "m", clase: "status-future" };
            }
            return { texto: "", clase: "" };
        }

        function renderizar(lista) {
            const container = document.getElementById('contenedor-eventos');
            container.innerHTML = '';
            
            if (!lista || lista.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#555; margin-top:40px;">No hay canales en esta sección.</p>';
                return;
            }

            lista.forEach(item => {
                let contenidoIcono = '';
                let mostrarIcono = true;

                if (item.origen === "MyFootball") {
                    mostrarIcono = false; 
                } else if (item.logo1 && item.logo2) {
                    contenidoIcono = '<div class="team-logos"><div class="logo-circle"><img src="'+item.logo1+'"></div><div class="logo-circle"><img src="'+item.logo2+'"></div></div>';
                } else {
                    let icono = 'fa-tv';
                    const txt = (item.titulo + item.categoria).toUpperCase();
                    if (txt.includes('FÚTBOL') || txt.includes('PIMPLE') || txt.includes('SOCCER')) icono = 'fa-futbol';
                    else if (txt.includes('MOTOR') || txt.includes('F1')) icono = 'fa-car-side';
                    else if (txt.includes('NBA') || txt.includes('BASKET')) icono = 'fa-basketball';
                    contenidoIcono = '<i class="fa-solid '+icono+'"></i>';
                }

                let infoTiempo = { texto: item.origen, clase: "" };
                if ((item.origen === "PimpleTV" || item.origen === "MyFootball") && item.timestamp) {
                    infoTiempo = calcularTiempo(item.timestamp);
                    item.titulo = item.titulo.replace(/\[\d{2}:\d{2}\]\s*/, '');
                }

                let botonesAccion = '';
                if (item.enlaces && item.enlaces.length > 0) {
                    // MODO VERTICAL PARA ANDROID TV
                    botonesAccion = '<div class="action-stack">';
                    item.enlaces.forEach(function(stream) {
                        let playBtn = !isIOS ? '<div class="action-icon play-btn" style="width:34px; height:34px; margin:0;" onclick="abrirEnlace(\''+stream.id+'\', event)"><i class="fa-solid fa-play" style="font-size:12px;"></i></div>' : '';
                        botonesAccion += '<div class="action-group-row">' +
                            '<img src="'+stream.bandera+'" class="lang-flag">' +
                            '<div style="display:flex; gap:10px;">' +
                                playBtn +
                                '<div class="action-icon copy-btn" style="width:34px; height:34px; margin:0;" onclick="copiarID(\''+stream.id+'\', this, event)"><i class="fa-regular fa-copy" style="font-size:12px;"></i></div>' +
                            '</div>' +
                        '</div>';
                    });
                    botonesAccion += '</div>';
                } else {
                    // MODO ESTÁNDAR
                    let playBtn = !isIOS ? '<div class="action-icon play-btn" onclick="abrirEnlace(\''+item.id+'\', event)"><i class="fa-solid fa-play"></i></div>' : '';
                    botonesAccion = playBtn + '<div class="action-icon copy-btn" onclick="copiarID(\''+item.id+'\', this, event)"><i class="fa-regular fa-copy"></i></div>';
                }

                const row = document.createElement('div');
                row.className = 'track-row';
                if(item.timestamp) row.dataset.timestamp = item.timestamp;
                
                row.onclick = function(e) { 
                    if (!item.enlaces) copiarID(item.id, this.querySelector('.copy-btn'), e); 
                };
                
                let iconHtml = mostrarIcono ? '<div class="track-icon-box">'+contenidoIcono+'</div>' : '';
                let paddingStyle = !mostrarIcono ? 'padding-left: 5px;' : '';

                row.innerHTML = iconHtml +
                    '<div class="track-info" style="'+paddingStyle+'">' +
                        '<div class="track-title" style="font-weight:600; font-size:1.05rem; margin-bottom:6px;">'+item.titulo+'</div>' +
                        '<div class="track-meta">' +
                            '<span class="status-badge '+infoTiempo.clase+'">'+infoTiempo.texto+'</span>' +
                            (item.origen !== 'PimpleTV' && item.origen !== 'MyFootball' ? '<span style="margin-left:8px; opacity:0.6; font-size:11px;">'+item.origen+'</span>' : '') +
                        '</div>' +
                    '</div>' +
                    '<div class="actions-container" style="'+(!mostrarIcono ? 'flex:1; justify-content:flex-end;' : '')+'">' +
                        botonesAccion +
                    '</div>';
                
                container.appendChild(row);
            });
        }

        function actualizarContadores() {
            document.querySelectorAll('.track-row[data-timestamp]').forEach(row => {
                const ts = parseInt(row.dataset.timestamp);
                const info = calcularTiempo(ts);
                const badge = row.querySelector('.status-badge');
                if (badge && info.texto) {
                    badge.className = 'status-badge ' + info.clase;
                    badge.innerText = info.texto;
                }
            });
        }

        function filtrar(categoria, btn) {
            categoriaActual = categoria;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            renderizar(todosLosDatos.filter(i => i.categoria === categoria));
        }

        function filtrarBusqueda() {
            const texto = document.getElementById('searchInput').value.toLowerCase();
            if (texto.length > 0) {
                renderizar(todosLosDatos.filter(i => (i.titulo + i.categoria).toLowerCase().includes(texto)));
            } else {
                renderizar(todosLosDatos.filter(i => i.categoria === categoriaActual));
            }
        }

        function copiarID(texto, btnElemento, evento) {
            if (evento) evento.stopPropagation();
            if (navigator.vibrate) navigator.vibrate(50);
            navigator.clipboard.writeText(texto).then(() => {
                const fila = btnElemento.closest('.track-row');
                document.querySelectorAll('.track-row').forEach(r => r.classList.remove('copied'));
                fila.classList.add('copied');
            });
        }

        function abrirEnlace(id, evento) {
            if (evento) evento.stopPropagation();
            if (navigator.vibrate) navigator.vibrate(50);
            window.location.href = 'acestream://' + id;
        }
        
        iniciarCarga();
    </script>
</body>
</html>
