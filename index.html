<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --fondo: #0f0f0f;
      --tarjeta: #1e1e1e;
      --foco: #0056b3;
      --texto: #ffffff;
    }

    body {
      background-color: var(--fondo);
      color: var(--texto);
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 30px;
    }

    h1 {
      font-size: 1.6rem;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
      margin-bottom: 25px;
    }

    .lista-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-partido {
      background-color: var(--tarjeta);
      padding: 20px;
      border-radius: 10px;
      border: 3px solid transparent;
      outline: none;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }

    /* Estilos para el mando de Android TV */
    .item-partido:focus {
      background-color: #2a2a2a;
      border-color: var(--foco);
      transform: scale(1.02);
    }

    .nombre-partido {
      font-size: 1.2rem;
      font-weight: 500;
    }

    .categoria {
      font-size: 0.8rem;
      color: #888;
      text-transform: uppercase;
    }

    .loading {
      text-align: center;
      margin-top: 50px;
      color: #555;
    }
  </style>
</head>
<body>

  <h1>Area Tecnica: Repeticiones y Jornada</h1>
  
  <div id="pantalla" class="lista-container">
    <div class="loading">Cargando eventos filtrados...</div>
  </div>

  <script>
    /**
     * Lógica de UI y Ejecución Nativa
     */

    function cargarContenido() {
      google.script.run
        .withSuccessHandler(renderizar)
        .obtenerPartidos();
    }

    function renderizar(partidos) {
      const pantalla = document.getElementById('pantalla');
      
      if (partidos.length === 0) {
        pantalla.innerHTML = '<div>No hay eventos disponibles para los filtros actuales.</div>';
        return;
      }

      pantalla.innerHTML = partidos.map(p => `
        <div class="item-partido" tabindex="0" onclick="lanzarReproductor('${p.id}')">
          <div>
            <div class="categoria">${p.cat}</div>
            <div class="nombre-partido">${p.title}</div>
          </div>
          <div style="color:var(--foco)">REPRODUCIR</div>
        </div>
      `).join('');

      // Auto-foco en el primer elemento para el mando a distancia
      setTimeout(() => {
        document.querySelector('.item-partido')?.focus();
      }, 100);
    }

    function lanzarReproductor(id) {
      // Forzado de reproductor nativo para saltar anuncios web
      const intentUrl = `acestream://?content_id=${id}&player=native`;
      console.log("Lanzando: " + intentUrl);
      window.location.href = intentUrl;
    }

    // Iniciar al cargar
    window.onload = cargarContenido;
  </script>
</body>
</html>
