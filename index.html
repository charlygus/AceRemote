<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AceRemote</title>
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    
    <link rel="stylesheet" href="style.css?v=35">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        /* Estilos del Carrusel Horizontal */
        .swipe-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
            max-width: 100%;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .swipe-container::-webkit-scrollbar {
            display: none;
        }
        .stream-pill {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 8px; 
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="brand-container">
                <img src="icon.png" alt="Logo" class="app-logo">
                <h1>AceRemote</h1>
            </div>
            <button onclick="iniciarCarga()" class="refresh-btn">
                <i class="fa-solid fa-arrows-rotate"></i>
            </button>
        </div>
        <div class="search-container">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="Buscar canal o partido..." onkeyup="filtrarBusqueda()">
            </div>
        </div>
    </header>

    <div id="tabs-container" class="tabs"></div>
    <div id="loader" class="loader-container"><div id="loader-text" class="loader-text">0%</div></div>
    <main id="contenedor-eventos"></main>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyaDrtYeHao6x9R8EWLh6gKAcStTmQuy5xaI3sfGmoYvrR4wSEpggrGEaa7kApO3LjI/exec'; 
        
        // --- CONFIGURACIÓN DE RED REMOTA PARA IOS ---
        const TAILSCALE_IP = "100.110.26.77";
        const PORT = "6878";
        const TOKEN = "qn7EzNF2SFIB";

        let todosLosDatos = []; 
        let categoriaActual = '';
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        async function iniciarCarga() {
            const container = document.getElementById('contenedor-eventos');
            const tabsContainer = document.getElementById('tabs-container');
            const loader = document.getElementById('loader');
            const loaderText = document.getElementById('loader-text');
            
            container.innerHTML = ''; 
            tabsContainer.innerHTML = '';
            loader.style.display = 'block';
            loaderText.innerText = '0%';
            
            todosLosDatos = [];
            
            const requests = [
                { url: API_URL + '?source=pimple', name: 'Pimple' },
                { url: API_URL + '?source=mf', name: 'MyFootball' },
                { url: API_URL + '?source=ace', name: 'Otros' }
            ];

            let completados = 0;
            const promesas = requests.map(req => {
                return fetch(req.url)
                    .then(r => r.json())
                    .then(data => {
                        completados++;
                        const p = Math.floor((completados / requests.length) * 100);
                        loaderText.innerText = p + '%';
                        return data;
                    })
                    .catch(e => {
                        console.error('Error en ' + req.name, e);
                        completados++;
                        loaderText.innerText = Math.floor((completados / requests.length) * 100) + '%';
                        return []; 
                    });
            });

            try {
                const resultados = await Promise.all(promesas);
                todosLosDatos = resultados.flat();
                todosLosDatos = eliminarDuplicados(todosLosDatos);

                setTimeout(() => {
                    loader.style.display = 'none';
                    if (todosLosDatos.length > 0) {
                        generarPestanas(todosLosDatos);
                        renderizar(todosLosDatos.filter(i => i.categoria === categoriaActual));
                        setInterval(actualizarContadores, 60000);
                    } else {
                        container.innerHTML = `<p style="text-align:center; color:#555; margin-top:40px;">No se encontraron eventos.</p>`;
                    }
                }, 300);

            } catch (error) {
                loaderText.innerText = 'Error';
                console.error(error);
            }
        }

        function eliminarDuplicados(datos) {
            const vistos = new Set();
            return datos.filter(item => {
                if (vistos.has(item.id)) return false;
                vistos.add(item.id);
                return true;
            });
        }

        function generarPestanas(datos) {
            const tabsContainer = document.getElementById('tabs-container');
            let categorias = [...new Set(datos.map(item => item.categoria))];
            const orden = ["PIMPLE TV", "MYFOOTBALL", "OTROS"];
            
            categorias.sort((a, b) => {
                let idxA = orden.indexOf(a);
                let idxB = orden.indexOf(b);
                if (idxA === -1) idxA = 50; 
                if (idxB === -1) idxB = 50;
                return idxA - idxB;
            });

            if (categorias.length > 0) {
                categoriaActual = categorias[0]; 
            }

            categorias.forEach((cat) => {
                if(cat) {
                    const btn = document.createElement('button');
                    btn.className = cat === categoriaActual ? 'tab-btn active' : 'tab-btn';
                    btn.innerText = cat; 
                    btn.onclick = function() { filtrar(cat, this); };
                    tabsContainer.appendChild(btn);
                }
            });
        }

        function calcularTiempo(timestamp) {
            if (!timestamp) return { texto: "", clase: "" };
            const ahora = new Date().getTime();
            const diff = timestamp - ahora;
            const diffMinutos = Math.floor(diff / 1000 / 60);

            if (diff <= 0 && diff > -7200000) return { texto: `EN JUEGO`, clase: "status-live" };
            if (diff <= -7200000) return { texto: "FINALIZADO", clase: "status-ended" };

            if (diff > 0) {
                const horas = Math.floor(diffMinutos / 60);
                const mins = diffMinutos % 60;
                if (horas > 24) {
                    let fecha = new Date(timestamp);
                    let dia = (fecha.getDate() < 10 ? '0' : '') + fecha.getDate();
                    let mes = (fecha.getMonth() + 1 < 10 ? '0' : '') + (fecha.getMonth() + 1);
                    return { texto: `${dia}/${mes} • ${fecha.getHours()}:${(fecha.getMinutes()<10?'0':'')+fecha.getMinutes()}`, clase: "status-future" };
                }
                if (horas === 0) return { texto: `Comienza en ${mins}m`, clase: "status-soon" };
                return { texto: `Comienza en ${horas}h ${mins}m`, clase: "status-future" };
            }
            return { texto: "", clase: "" };
        }

        function renderizar(lista) {
            const container = document.getElementById('contenedor-eventos');
            container.innerHTML = '';
            if (lista.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#555; margin-top:40px;">No hay canales disponibles.</p>`;
                return;
            }
            lista.forEach(item => {
                let contenidoIcono = '';
                let mostrarIcono = true;
                
                if (item.origen === "MyFootball") {
                    mostrarIcono = false; 
                } else if (item.logo1 && item.logo2) {
                    contenidoIcono = `
                        <div class="team-logos">
                            <div class="logo-circle"><img src="${item.logo1}" alt="L"></div>
                            <div class="logo-circle"><img src="${item.logo2}" alt="V"></div>
                        </div>
                    `;
                } else {
                    let icono = 'fa-tv';
                    const txt = (item.titulo + item.categoria).toUpperCase();
                    if (txt.includes('FÚTBOL') || txt.includes('PIMPLE') || txt.includes('SOCCER')) icono = 'fa-futbol';
                    else if (txt.includes('MOTOR') || txt.includes('F1')) icono = 'fa-car-side';
                    contenidoIcono = `<i class="fa-solid ${icono}"></i>`;
                }

                let infoTiempo = { texto: item.origen, clase: "" };
                if ((item.origen === "PimpleTV" || item.origen === "MyFootball") && item.timestamp) {
                    let t = calcularTiempo(item.timestamp);
                    item.titulo = item.titulo.replace(/\[\d{2}:\d{2}\]\s*/, '');
                    infoTiempo = t;
                }

                let botonesAccion = '';
                if (item.enlaces && item.enlaces.length > 0) {
                    botonesAccion += `<div class="swipe-container" style="margin-left:auto;">`;
                    item.enlaces.forEach((stream) => {
                        botonesAccion += `
                        <div class="stream-pill">
                            <img src="${stream.bandera}" style="width:26px; height:16px; margin-bottom:8px; border-radius:2px;" alt="bandera">
                            <div style="display:flex; gap:6px;">
                                <div class="action-icon play-btn" style="margin:0; width:50px; height:50px; font-size:32px; display:flex; align-items:center; justify-content:center;" onclick="abrirEnlace('${stream.id}', event)"><i class="fa-solid fa-play"></i></div>
                                <div class="action-icon copy-btn" style="margin:0; width:50px; height:50px; font-size:32px; display:flex; align-items:center; justify-content:center;" onclick="copiarID('${stream.id}', this, event)"><i class="fa-regular fa-copy"></i></div>
                            </div>
                        </div>`;
                    });
                    botonesAccion += `</div>`;
                } else {
                    botonesAccion += `<div class="action-icon play-btn" onclick="abrirEnlace('${item.id}', event)"><i class="fa-solid fa-play"></i></div>`;
                    botonesAccion += `<div class="action-icon copy-btn" onclick="copiarID('${item.id}', this, event)"><i class="fa-regular fa-copy"></i></div>`;
                }

                const row = document.createElement('div');
                row.className = 'track-row';
                if(item.timestamp) row.dataset.timestamp = item.timestamp;
                
                row.onclick = function(e) { 
                    if (!item.enlaces) copiarID(item.id, this.querySelector('.copy-btn'), e); 
                };
                
                row.innerHTML = `
                    ${mostrarIcono ? `<div class="track-icon-box">${contenidoIcono}</div>` : ''}
                    <div class="track-info" style="${!mostrarIcono ? 'padding-left: 10px; min-width: 40%;' : ''}">
                        <div class="track-title">${item.titulo}</div>
                        <div class="track-meta">
                            <span class="status-badge ${infoTiempo.clase}">${infoTiempo.texto}</span>
                            ${item.origen !== 'PimpleTV' && item.origen !== 'MyFootball' ? item.origen : ''} 
                        </div>
                    </div>
                    <div class="actions-container" style="${!mostrarIcono ? 'flex-grow: 1; display: flex; overflow: hidden;' : ''}">${botonesAccion}</div>
                `;
                container.appendChild(row);
            });
        }

        function actualizarContadores() {
            document.querySelectorAll('.track-row[data-timestamp]').forEach(row => {
                const ts = parseInt(row.dataset.timestamp);
                const info = calcularTiempo(ts);
                const badge = row.querySelector('.status-badge');
                if (badge && info.texto) {
                    badge.className = `status-badge ${info.clase}`;
                    badge.innerText = info.texto;
                }
            });
        }

        function filtrar(categoria, btn) {
            categoriaActual = categoria;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            renderizar(todosLosDatos.filter(i => i.categoria === categoria));
        }

        function filtrarBusqueda() {
            const texto = document.getElementById('searchInput').value.toLowerCase();
            if (texto.length > 0) {
                renderizar(todosLosDatos.filter(i => (i.titulo + i.categoria).toLowerCase().includes(texto)));
            } else {
                renderizar(todosLosDatos.filter(i => i.categoria === categoriaActual));
            }
        }

        function copiarID(texto, btnElemento, evento) {
            if (evento) evento.stopPropagation();
            if (navigator.vibrate) navigator.vibrate(50);
            navigator.clipboard.writeText(texto).then(() => {
                const fila = btnElemento.closest('.track-row');
                document.querySelectorAll('.track-row').forEach(r => r.classList.remove('copied'));
                fila.classList.add('copied');
            });
        }

        function abrirEnlace(id, evento) {
            if (evento) evento.stopPropagation();
            if (navigator.vibrate) navigator.vibrate(50);
            
            if (isIOS) {
                // Genera la URL optimizada HLS con la nueva IP de Tailscale y el token para abrir VLC en iOS
                const streamUrl = `http://${TAILSCALE_IP}:${PORT}/ace/manifest.m3u8?id=${id}&access_token=${TOKEN}`;
                const vlcCallbackUrl = `vlc-x-callback://x-callback-url/stream?url=` + encodeURIComponent(streamUrl);
                window.location.href = vlcCallbackUrl;
            } else {
                // Comportamiento habitual para Android y PC
                window.location.href = 'acestream://' + id;
            }
        }
        
        iniciarCarga();
    </script>
</body>
</html>
